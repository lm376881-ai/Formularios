<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa</title>
</head>

<body>

    <h1>Pesquisa De Usuário</h1>

    <form action="" method="get">



        <fieldset>
            <legend> Dados Pessoais</legend>
            <label for="nomeUsuario">Nome do usuário:</label>
            <input type="text" name="nomeUsuario" id="nomeUsuarioId" required>
            <br>
            <label for="idadeUsuario">Idade do usuário:</label>
            <input type="number" name="idadeUsuario" id="idadeUsuarioId" min="18" max="120">
            <br>
            <label for="dtNascimento">Data de Nascimento:</label>
            <input type="date" name="dtNascimento" id="dtNascimentoId">
            <br>
            
            <label for="emailUsuario">Email:</label>
            <input type="text" name="emailUsuario" id="emailUsuario">
            <br>

            <label for="foneUsuario">Telefone:</label>
            <input type="text" name="foneUsuario" id="foneUsuario" maxlength="11">
            <br>

            <label for="fotoUsuario">Foto do cliente:</label>
            <input type="file" name="fotoUsuario" id="fotoUsuario" accept="image/*">
            <br>

            <br>
            
            <label for="estado civil">Estadi Civil</label>
            <select name="estadoCivil" id="estadoCivil"> 
                <option value="casado">Casado(a)</option>
                <option value="solteiro">Solteiro(a)</option>
                <option value="viuvo">Viuvo(a)</option>
                <option value="divorciado">Divorciado(a)</option>
                <option value="uniao">Uniao Estável</option>
            </select>


<label for="estadosId">Estado</label>
<select name="estados" id="estadosId">
<option value="AC">Acre</option>
<option value="AL">Alagoas</option>
<option value="AP">Amapá</option>
<option value="AM">Amazonas</option>
<option value="BA">Bahia</option>
<option value="CE">Ceará</option>
<option value="DF">Distrito Federal</option>
<option value="ES">Espirito Santo</option>
<option value="GO">Goiás</option>
<option value="MA">Maranhão</option>
<option value="MS">Mato Grosso do Sul</option>
<option value="MT">Mato Grosso</option>
<option value="MG">Minas Gerais</option>
<option value="PA">Pará</option>
<option value="PB">Paraíba</option>
<option value="PR">Paraná</option>
<option value="PE">Pernambuco</option>
<option value="PI">Piauí</option>
<option value="RJ">Rio de Janeiro</option>
<option value="RN">Rio Grande do Norte</option>
<option value="RS">Rio Grande do Sul</option>
<option value="RO">Rondônia</option>
<option value="RR">Roraima</option>
<option value="SC">Santa Catarina</option>
<option value="SP">São Paulo</option>
<option value="SE">Sergipe</option>
<option value="TO">Tocantins</option>
</select>
<br>

<label for="usuarioCidadeId">Cidade</label>
<input type="text" name="usuarioCidade" id="usuarioCidadeId">
        
        </fieldset>
        







        <button type="submit"> Enviar dados</button>
        <button type="reset">Limpar</button>

    </form>

</body>

</html>
